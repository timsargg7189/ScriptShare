<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScriptShare</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        
        body { 
            background-color: #0f0f0f; 
            color: #fff; 
            font-family: 'Vazirmatn', sans-serif; 
            padding: 20px; 
            padding-bottom: 60px; 
            margin: 0;
        }
        
        .container { 
            max-width: 600px; 
            margin: auto; 
        }
        
        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            padding-bottom: 15px;
            border-bottom: 1px solid #222;
        }
        
        .header h1 { 
            margin: 0; 
            color: #FFCC00; 
            font-size: 24px;
        }
        
        .btn { 
            background-color: #FFCC00; 
            color: #000; 
            padding: 10px 15px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 14px;
            transition: 0.2s;
        }
        
        .btn:hover {
            background-color: #e6b800;
        }
        
        .search-bar { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 25px; 
            border-radius: 8px; 
            border: 1px solid #333; 
            background: #1a1a1a; 
            color: #fff; 
            box-sizing: border-box; 
            font-family: inherit;
            outline: none;
        }
        
        .search-bar:focus {
            border-color: #FFCC00;
        }
        
        .card { 
            background-color: #1a1a1a; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border: 1px solid #2a2a2a; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .card h3 { 
            margin-top: 0; 
            color: #FFCC00; 
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .card p { 
            font-size: 13px; 
            color: #aaa; 
            line-height: 1.6;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 3; 
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            word-break: break-word;
        }
        
        .code-container {
            background: #000; 
            border-radius: 8px; 
            border: 1px solid #333;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .card pre { 
            margin: 0;
            padding: 15px; 
            overflow-x: auto; 
            font-size: 12px; 
            white-space: pre-wrap; 
            word-wrap: break-word;
            max-height: 150px;
        }
        
        .card pre::-webkit-scrollbar {
            height: 6px;
            width: 6px;
        }
        .card pre::-webkit-scrollbar-thumb {
            background: #444; 
            border-radius: 3px;
        }
        
        .action-btns { 
            display: flex; 
            justify-content: flex-start; 
            align-items: center; 
        }
        
        .copy-btn { 
            background: #4caf50; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            font-family: inherit;
            transition: 0.2s;
        }
        
        .copy-btn:hover { 
            background: #45a049; 
        }
        
        .footer { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            text-align: right; 
            padding: 12px 20px; 
            font-size: 11px; 
            color: #666; 
            background: #0f0f0f; 
            border-top: 1px solid #222; 
            box-sizing: border-box; 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ScriptShare</h1>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLScGiLGZfESfoYGQpDkUGOl02up2wG0BqwMy1ElWV84KAo0rkA/viewform" target="_blank" class="btn">+ افزودن اسکریپت</a>
        </div>
        
        <input type="text" id="searchInput" class="search-bar" placeholder="جستجوی اسکریپت...">
        
        <div id="scripts-list">
            <p style="text-align:center; color:#666;">در حال بارگذاری...</p>
        </div>
    </div>

    <div class="footer">
        Timsar ScriptShare | V2.0
    </div>

    <script>
        const csvUrl = "https://docs.google.com/spreadsheets/d/1zQealMxZVcRvb9ZEi9OsU_ntRnsX2mMqYRO2rNuXJAY/export?format=csv";
        let allScripts = [];

        async function fetchScripts() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                const rows = data.split('\n');
                
                if (rows.length < 2) {
                    document.getElementById('scripts-list').innerHTML = '<p style="text-align:center; color:#666;">هنوز اسکریپتی آپلود نشده.</p>';
                    return;
                }

                const headers = rows[0].split(',');
                let nameIdx = 1, descIdx = 3, codeIdx = 2;
                headers.forEach((h, i) => {
                    const lowerH = h.toLowerCase();
                    if (lowerH.includes('name')) nameIdx = i;
                    if (lowerH.includes('desc')) descIdx = i;
                    if (lowerH.includes('code')) codeIdx = i;
                });

                allScripts = [];

                for (let i = 1; i < rows.length; i++) {
                    if (!rows[i].trim()) continue;
                    
                    let currentLine = rows[i];
                    let cols = [];
                    let inQuotes = false;
                    let currentCol = '';

                    for (let char of currentLine) {
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            cols.push(currentCol);
                            currentCol = '';
                        } else {
                            currentCol += char;
                        }
                    }
                    cols.push(currentCol);
                    cols = cols.map(c => c.replace(/^"|"$/g, ''));

                    const name = cols[nameIdx] || 'بدون نام';
                    const desc = cols[descIdx] || 'بدون توضیحات';
                    let code = cols[codeIdx] || 'بدون کد';
                    code = code.replace(/<br>/g, '\n');

                    if (name === 'بدون نام' || !name) continue;

                    allScripts.push({ name, desc, code });
                }

                renderScripts(allScripts);
            } catch (e) {
                console.error(e);
                document.getElementById('scripts-list').innerHTML = '<p style="text-align:center; color:red;">خطا در دریافت اطلاعات.</p>';
            }
        }

        function renderScripts(scripts) {
            const container = document.getElementById('scripts-list');
            container.innerHTML = '';

            if (scripts.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#666;">اسکریپتی یافت نشد.</p>';
                return;
            }

            scripts.forEach(script => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${script.name}</h3>
                    <p>${script.desc}</p>
                    <div class="code-container">
                        <pre><code>${script.code}</code></pre>
                    </div>
                    <div class="action-btns">
                        <button class="copy-btn" onclick="copyText(\`${script.code.replace(/`/g, '\\`')}\`)">کپی کد</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('کد کپی شد!');
            });
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = allScripts.filter(s => s.name.toLowerCase().includes(query));
            renderScripts(filtered);
        });

        fetchScripts();
    </script>
</body>
</html>
